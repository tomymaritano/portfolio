<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <rect width="720" height="220" fill="#0c0c0c"/>
  <rect x="24" y="28" width="328" height="164" rx="12" stroke="#1d1d1d" fill="#111"/>
  <rect x="368" y="28" width="328" height="164" rx="12" stroke="#1d1d1d" fill="#111"/>
  <text x="188" y="56" text-anchor="middle" fill="#f3f3f3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Cursor + Grok 4.6</text>
  <text x="532" y="56" text-anchor="middle" fill="#f3f3f3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Grok Bot</text>
  <text x="188" y="88" text-anchor="middle" fill="#8d8d8d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">your repo, your laptop</text>
  <text x="532" y="88" text-anchor="middle" fill="#8d8d8d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">a cloud VM with a browser</text>
  <text x="188" y="120" text-anchor="middle" fill="#8d8d8d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">agent reads files, runs tests</text>
  <text x="532" y="120" text-anchor="middle" fill="#8d8d8d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">signs into tools, runs routines</text>
  <text x="188" y="152" text-anchor="middle" fill="#8d8d8d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">you review the diff</text>
  <text x="532" y="152" text-anchor="middle" fill="#8d8d8d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">you approve the handoff</text>
  <text x="188" y="176" text-anchor="middle" fill="#6eedc6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">same spine as the editor</text>
  <text x="532" y="176" text-anchor="middle" fill="#6eedc6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">a teammate, not a buffer</text>
</svg>
